<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEOESTADO · Suscriptores</title>
<style>
:root {
  --fondo: #F5F5F7; --panel: #FFFFFF; --texto: #1D1B26; --suave: #6B6880; --linea: #E4E1EE;
  --marca: #6D28D9; --marca-osc: #5B21B6; --tinta: #F5F3FF; --borde-tinta: #DDD6FE; --hondo: #2E1065;
  --ok: #15803D; --ok-fondo: #DCFCE7; --aviso: #B45309; --aviso-fondo: #FEF3C7; --peligro: #B91C1C; --peligro-fondo: #FEE2E2;
  --sombra: 0 1px 2px rgba(46,16,101,.06), 0 8px 24px rgba(46,16,101,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #0F0B1A; --panel: #1A1428; --texto: #F2EFFA; --suave: #A59FBD; --linea: #2E2745;
    --marca: #A78BFA; --marca-osc: #C4B5FD; --tinta: #251A42; --borde-tinta: #43307A; --hondo: #EDE9FE;
    --ok: #4ADE80; --ok-fondo: #14301F; --aviso: #FBBF24; --aviso-fondo: #3A2A0A; --peligro: #F87171; --peligro-fondo: #3A1515;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); line-height: 1.45;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.giro { animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
:focus-visible { outline: 3px solid var(--borde-tinta); outline-offset: 1px; }

/* encabezado */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--linea); }
.barra { max-width: 980px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.barra img { width: 40px; height: 40px; border-radius: 10px; }
.barra h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.barra small { display: block; color: var(--suave); font-size: 12.5px; }
.espacio { flex: 1; }
.txt-c { display: none; }
.btn { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linea); background: var(--panel);
  border-radius: 10px; padding: 8px 14px; min-height: 40px; font-weight: 550; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--tinta); border-color: var(--borde-tinta); }
.btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.primario:hover { background: var(--marca-osc); }
.btn.peligro { background: var(--peligro); border-color: var(--peligro); color: #fff; }
.btn.fantasma { border-color: transparent; background: transparent; }
.btn.icono { padding: 8px; min-width: 40px; justify-content: center; }
.btn[disabled] { opacity: .55; cursor: default; }

main { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }
.resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.dato { background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; box-shadow: var(--sombra); }
.dato b { display: block; font-size: 26px; letter-spacing: -.02em; color: var(--hondo); }
.dato span { color: var(--suave); font-size: 13px; }
.buscar { position: relative; margin-bottom: 14px; }
.buscar svg { position: absolute; left: 14px; top: 13px; color: var(--suave); }
.buscar input[type=text] { width: 100%; padding: 11px 14px 11px 42px; border: 1px solid var(--linea); border-radius: 12px; background: var(--panel); }

/* lista */
.fila { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--linea);
  border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--sombra); cursor: pointer; transition: border-color .15s; }
.fila:hover { border-color: var(--borde-tinta); }
.fila.en-pausa { opacity: .72; }
.avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 650; flex: none; letter-spacing: .02em; }
.info { flex: 1; min-width: 0; }
.titulo { font-weight: 620; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub { color: var(--suave); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.etq { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--tinta); color: var(--marca-osc); border: 1px solid var(--borde-tinta); }
.etq svg { width: 13px; height: 13px; }
.estado { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--ok-fondo); color: var(--ok); }
.estado.pausa { background: var(--aviso-fondo); color: var(--aviso); }
.lado { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.envio { font-size: 12px; color: var(--suave); white-space: nowrap; }
.acciones { display: flex; gap: 2px; }
.acciones .btn { min-height: 34px; min-width: 34px; padding: 6px; }
.vacio { text-align: center; padding: 56px 16px; color: var(--suave); background: var(--panel); border: 1px dashed var(--borde-tinta); border-radius: 16px; }
.vacio svg { width: 40px; height: 40px; color: var(--marca); margin-bottom: 8px; }

/* interruptor */
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; background: var(--linea); border-radius: 999px; transition: background .2s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw input:checked + i { background: var(--marca); }
.sw input:checked + i::after { transform: translateX(18px); }
.sw input:focus-visible + i { outline: 3px solid var(--borde-tinta); }

/* hoja lateral */
.velo { position: fixed; inset: 0; background: rgba(15,11,26,.45); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.velo.abierto { opacity: 1; pointer-events: auto; }
.hoja { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21; display: flex; flex-direction: column;
  transform: translateX(102%); transition: transform .28s cubic-bezier(.32,.72,0,1); box-shadow: -12px 0 40px rgba(0,0,0,.2); }
.hoja.abierto { transform: none; }
.hoja header { position: static; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--linea); background: var(--panel); backdrop-filter: none; }
.hoja header h2 { margin: 0; font-size: 17px; flex: 1; }
.pestanas { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--linea); }
.pestanas button { border: 0; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--suave); font-weight: 600; margin-bottom: -1px; }
.pestanas button[aria-selected="true"] { color: var(--marca); border-color: var(--marca); }
.cuerpo { flex: 1; overflow: auto; padding: 18px 16px 28px; }
.pie { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linea); background: var(--panel); }
.campo { margin-bottom: 20px; }
.campo > label, .campo > .rotulo { display: flex; align-items: center; gap: 7px; font-weight: 620; margin-bottom: 6px; }
.ayuda { color: var(--suave); font-size: 13px; margin: 4px 0 0; }
input[type=text], input[type=email], input[type=number], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 10px; background: var(--panel); min-height: 42px; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--borde-tinta); border-color: var(--marca); }
.caja { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--linea); border-radius: 10px; min-height: 46px; background: var(--panel); }
.caja:focus-within { outline: 3px solid var(--borde-tinta); border-color: var(--marca); }
.caja input { flex: 1; min-width: 140px; border: 0; padding: 6px; min-height: 32px; background: transparent; outline: none !important; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--tinta); color: var(--marca-osc); border: 1px solid var(--borde-tinta); border-radius: 8px; padding: 3px 4px 3px 9px; font-size: 14px; }
.chip button { border: 0; background: none; padding: 3px; border-radius: 6px; color: inherit; display: grid; place-items: center; opacity: .75; }
.chip button:hover { opacity: 1; background: var(--borde-tinta); }
.chip button.activo { opacity: 1; background: var(--marca); color: #fff; }
.chip svg { width: 14px; height: 14px; }
.aviso-chip { color: var(--aviso); background: var(--aviso-fondo); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 8px; display: flex; gap: 6px; align-items: flex-start; }
.segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--fondo); padding: 4px; border-radius: 12px; }
.segmento button { border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 600; color: var(--suave); }
.segmento button[aria-pressed="true"] { background: var(--panel); color: var(--marca-osc); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.interruptor { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--linea); border-radius: 12px; }
.interruptor > div { flex: 1; }
.interruptor b { display: block; }
.dupla { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.sugerencias { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; box-shadow: var(--sombra); max-height: 260px; overflow: auto; z-index: 3; }
.sugerencias button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; }
.sugerencias button:hover, .sugerencias button.sel { background: var(--tinta); }
.sugerencias small { color: var(--suave); white-space: nowrap; }
.rel { position: relative; }
.alerta { padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; display: flex; gap: 8px; background: var(--peligro-fondo); color: var(--peligro); font-size: 14px; }
.alerta.info { background: var(--tinta); color: var(--marca-osc); }
.previa { border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; background: #fff; }
.previa iframe { width: 100%; height: 62vh; border: 0; display: block; background: #fff; }
.previa-asunto { padding: 10px 14px; background: var(--tinta); color: var(--marca-osc); font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--borde-tinta); }

/* diálogos y avisos */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(440px, calc(100% - 32px)); background: var(--panel); color: var(--texto); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(15,11,26,.5); }
.dlg { padding: 22px; }
.dlg h3 { margin: 0 0 6px; font-size: 18px; }
.dlg p { margin: 0 0 18px; color: var(--suave); }
.dlg .botones { display: flex; gap: 10px; justify-content: flex-end; }
.dlg.ancho { max-height: 80vh; overflow: auto; }
.registro { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--fondo); border-radius: 10px; padding: 10px; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.respaldo { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linea); }
.respaldo div { flex: 1; min-width: 0; }
.respaldo small { color: var(--suave); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#avisos { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 40; pointer-events: none; padding: 0 16px; }
.aviso { pointer-events: auto; background: var(--hondo); color: var(--panel); padding: 11px 14px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: 520px; animation: sube .25s ease; }
.aviso button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
@keyframes sube { from { opacity: 0; transform: translateY(10px); } }
#sin-clave { max-width: 480px; margin: 20vh auto; text-align: center; padding: 16px; }

@media (max-width: 640px) {
  .fila { flex-wrap: wrap; }
  .lado { flex-direction: row; width: 100%; justify-content: space-between; align-items: center; padding-left: 60px; }
  .resumen .dato b { font-size: 22px; }
  .barra small { display: none; }
  .btn .txt { display: none; }
  .txt-l { display: none; }
  .txt-c { display: inline; }
  .dupla { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="sin-clave" hidden>
  <h1>Falta la clave de la sesión</h1>
  <p>Abre la dirección completa que mostró <code>admin.py</code> al iniciar (termina en <code>?c=…</code>).</p>
</div>

<div id="app" hidden>
  <header>
    <div class="barra">
      <img src="/logo.png" alt="" onerror="this.remove()">
      <div><h1>Suscriptores</h1><small>NEOESTADO · quién recibe qué</small></div>
      <div class="espacio"></div>
      <button class="btn" id="b-historial" title="Historial de cambios"><span data-i="history"></span><span class="txt">Historial</span></button>
      <button class="btn primario" id="b-nuevo"><span data-i="plus"></span><span class="txt-l">Nuevo suscriptor</span><span class="txt-c">Nuevo</span></button>
    </div>
  </header>
  <main>
    <div id="error-ini"></div>
    <div class="resumen">
      <div class="dato"><b id="n-total">0</b><span>Suscriptores</span></div>
      <div class="dato"><b id="n-activos">0</b><span>Activos</span></div>
      <div class="dato"><b id="n-pausa">0</b><span>En pausa</span></div>
    </div>
    <div class="buscar"><span data-i="search"></span><input type="text" id="filtro" placeholder="Buscar por nombre, correo, región, palabra o entidad" aria-label="Buscar"></div>
    <div id="lista"></div>
  </main>
</div>

<div class="velo" id="velo"></div>
<aside class="hoja" id="hoja" aria-hidden="true" aria-labelledby="h-titulo">
  <header>
    <h2 id="h-titulo">Nuevo suscriptor</h2>
    <button class="btn icono fantasma" id="h-cerrar" aria-label="Cerrar"><span data-i="x"></span></button>
  </header>
  <div class="pestanas" role="tablist">
    <button role="tab" data-tab="datos" aria-selected="true">Datos</button>
    <button role="tab" data-tab="intereses" aria-selected="false">Intereses</button>
    <button role="tab" data-tab="empleos" aria-selected="false">Empleos</button>
    <button role="tab" data-tab="vista" aria-selected="false">Vista previa</button>
  </div>
  <div class="cuerpo" id="h-cuerpo"></div>
  <div class="pie">
    <button class="btn" id="h-cancelar">Cancelar</button>
    <button class="btn primario" id="h-guardar"><span data-i="check"></span>Guardar</button>
  </div>
</aside>

<dialog id="dlg"></dialog>
<div id="avisos" aria-live="polite"></div>

<script>
"use strict";
const CLAVE = new URLSearchParams(location.search).get("c");
const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ICONOS = {
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  building: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
  tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  quote: '<path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3z"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  undo: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  briefcase: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
};
const ic = (n, extra = "") => `<svg class="i ${extra}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n]}</svg>`;
const pintarIconos = (raiz = document) => raiz.querySelectorAll("[data-i]").forEach(e => { e.outerHTML = ic(e.dataset.i); });

async function api(ruta, cuerpo) {
  const r = await fetch("/api/" + ruta, {
    method: cuerpo === undefined ? "GET" : "POST",
    headers: { "X-Clave": CLAVE, "Content-Type": "application/json" },
    body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
  });
  const datos = await r.json().catch(() => ({ error: "Respuesta inválida del panel" }));
  if (!r.ok) throw new Error(datos.error || "Error " + r.status);
  return datos;
}

/* ---------- avisos y diálogos ---------- */
function aviso(texto, accion, alPulsar) {
  const e = document.createElement("div");
  e.className = "aviso";
  e.innerHTML = `<span>${esc(texto)}</span>` + (accion ? `<button>${esc(accion)}</button>` : "");
  $("#avisos").append(e);
  const quitar = () => e.remove();
  if (accion) e.querySelector("button").onclick = () => { quitar(); alPulsar(); };
  setTimeout(quitar, accion ? 9000 : 4500);
}
function preguntar(titulo, texto, boton, peligro) {
  const d = $("#dlg");
  d.innerHTML = `<div class="dlg"><h3>${esc(titulo)}</h3><p>${esc(texto)}</p><div class="botones">
    <button class="btn" value="no">Cancelar</button><button class="btn ${peligro ? "peligro" : "primario"}" value="si">${esc(boton)}</button></div></div>`;
  d.showModal();
  return new Promise(res => {
    d.onclick = e => { const v = e.target.closest("button")?.value; if (v) { d.close(); res(v === "si"); } };
    d.oncancel = () => res(false);
  });
}

/* ---------- datos ---------- */
let perfiles = [];
let entidadesCatalogo = null;

async function cargar() {
  try {
    const d = await api("estado");
    perfiles = d.perfiles;
    $("#error-ini").innerHTML = d.error ? `<div class="alerta">${ic("warn")}<div><b>perfiles.ini tiene un error.</b> ${esc(d.error)}<br>Abre el Historial y restaura el último respaldo bueno, o corrígelo a mano.</div></div>` : "";
    pintar();
  } catch (e) { aviso(e.message); }
}

const colores = ["#6D28D9", "#4F46E5", "#7C3AED", "#2563EB", "#9333EA", "#0F766E", "#B45309", "#BE185D"];
const iniciales = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase() || "?";
const colorDe = n => colores[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % colores.length];
function ultimo(f) {
  if (!f) return "Aún sin envíos";
  const [d, h] = f.split("T");
  const m = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"][+d.slice(5, 7) - 1];
  return `Último envío: ${+d.slice(8, 10)} ${m}, ${(h || "").slice(0, 5)}`;
}
const texto = p => [p.nombre, p.nota, ...p.correos, ...p.palabras, ...p.regiones, ...p.entidades, ...p.empleo_palabras, ...p.empleo_regiones, p.uniq ? "UNIQ" : ""].join(" ").toLowerCase();
const sinTildes = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function pintar() {
  const q = sinTildes($("#filtro").value.trim());
  const activos = perfiles.filter(p => !p.pausado).length;
  $("#n-total").textContent = perfiles.length;
  $("#n-activos").textContent = activos;
  $("#n-pausa").textContent = perfiles.length - activos;
  const vistos = perfiles.filter(p => !q || sinTildes(texto(p)).includes(q));
  if (!perfiles.length) {
    $("#lista").innerHTML = `<div class="vacio">${ic("users")}<p><b>Aún no hay suscriptores</b><br>Crea el primero: elige sus correos, regiones y palabras clave.</p></div>`;
    return;
  }
  if (!vistos.length) { $("#lista").innerHTML = `<div class="vacio"><p>Nada coincide con “${esc($("#filtro").value)}”.</p></div>`; return; }
  $("#lista").innerHTML = vistos.map(p => {
    const i = perfiles.indexOf(p);
    const etq = (n, k, t) => n ? `<span class="etq">${ic(k)}${esc(t)}</span>` : "";
    return `<article class="fila ${p.pausado ? "en-pausa" : ""}" data-idx="${i}" tabindex="0">
      <div class="avatar" style="background:${colorDe(p.nombre)}">${esc(iniciales(p.nombre))}</div>
      <div class="info">
        <div class="titulo">${esc(p.nombre)}<span class="estado ${p.pausado ? "pausa" : ""}">${p.pausado ? "En pausa" : "Activo"}</span></div>
        <div class="sub">${esc(p.nota || p.correos.join(", "))}</div>
        <div class="etiquetas">
          ${etq(p.correos.length, "mail", p.correos.length === 1 ? p.correos[0] : p.correos.length + " correos")}
          ${etq(p.regiones.length, "pin", p.regiones.length + (p.regiones.length === 1 ? " región" : " regiones"))}
          ${etq(p.palabras.length, "tag", p.palabras.length + (p.palabras.length === 1 ? " palabra" : " palabras"))}
          ${etq(p.entidades.length, "building", p.entidades.length + (p.entidades.length === 1 ? " entidad" : " entidades"))}
          ${etq(p.uniq, "check", "UNIQ")}
          ${etq(p.empleo_palabras.length || p.empleo_regiones.length || p.empleo_sueldo, "briefcase", "Empleos" + (p.empleo_sueldo ? " desde S/ " + p.empleo_sueldo : ""))}
        </div>
      </div>
      <div class="lado">
        <label class="sw" title="${p.pausado ? "Reanudar envíos" : "Pausar envíos"}"><input type="checkbox" data-pausa ${p.pausado ? "" : "checked"} aria-label="Recibe informes"><i></i></label>
        <span class="envio">${esc(ultimo(p.enviado))}</span>
        <div class="acciones">
          <button class="btn fantasma icono" data-a="enviar" title="Enviar el informe ahora">${ic("send")}</button>
          <button class="btn fantasma icono" data-a="copiar" title="Duplicar">${ic("copy")}</button>
          <button class="btn fantasma icono" data-a="borrar" title="Eliminar">${ic("trash")}</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

$("#filtro").oninput = pintar;
$("#lista").onclick = async e => {
  const fila = e.target.closest(".fila");
  if (!fila) return;
  const p = perfiles[+fila.dataset.idx];
  if (e.target.closest(".sw")) {
    if (e.target.matches("input")) alternarPausa(p, !e.target.checked);
    return;
  }
  const a = e.target.closest("[data-a]")?.dataset.a;
  if (a === "enviar") return enviarAhora(p);
  if (a === "copiar") return abrir(null, { ...structuredClone(p), nombre: p.nombre + " (copia)", pausado: false });
  if (a === "borrar") return borrar(p);
  abrir(p.nombre, structuredClone(p));
};
$("#lista").onkeydown = e => { if (e.key === "Enter" && e.target.matches(".fila")) e.target.click(); };

function conDeshacer(texto, d) {
  aviso(texto, d.respaldo ? "Deshacer" : null, async () => {
    try { await api("restaurar", { archivo: d.respaldo }); aviso("Cambio deshecho"); cargar(); } catch (e) { aviso(e.message); }
  });
}
async function alternarPausa(p, pausado) {
  try { conDeshacer(pausado ? `${p.nombre}: envíos en pausa` : `${p.nombre}: envíos reanudados`, await api("pausar", { nombre: p.nombre, pausado })); } catch (e) { aviso(e.message); }
  cargar();
}
async function borrar(p) {
  if (!await preguntar(`Eliminar a ${p.nombre}`, "Dejará de recibir informes. Podrás deshacerlo enseguida o desde el Historial.", "Eliminar", true)) return;
  try { conDeshacer(`${p.nombre} eliminado`, await api("eliminar", { nombre: p.nombre })); } catch (e) { aviso(e.message); }
  cargar();
}
async function enviarAhora(p) {
  if (!await preguntar(`Enviar ahora a ${p.nombre}`, `Se enviará hoy el informe completo a ${p.correos.join(", ")}. Tarda 1 o 2 minutos.`, "Enviar")) return;
  aviso("Enviando el informe… puede tardar un par de minutos");
  try {
    const d = await api("enviar", { nombre: p.nombre });
    aviso(d.ok ? `Informe enviado a ${p.correos.join(", ")}` : "No se pudo enviar: " + d.salida.split("\n").pop());
  } catch (e) { aviso(e.message); }
  cargar();
}

/* ---------- hoja de edición ---------- */
let ed = null;       // { original, p, tab, sucio }
const PALABRAS_GENERALES = new Set(["sistema", "servicio", "servicios", "bien", "bienes", "obra", "obras", "compra", "adquisicion", "contratacion", "material", "materiales", "equipo", "equipos", "insumo", "insumos"]);

function abrir(original, p) {
  ed = { original, p: { nombre: "", nota: "", correos: [], palabras: [], regiones: [], entidades: [], uniq: false, completo: true, pausado: false, empleo_palabras: [], empleo_regiones: [], empleo_sueldo: null, ...p }, tab: "datos", sucio: false, previa: null };
  $("#h-titulo").textContent = original ? original : "Nuevo suscriptor";
  mostrarTab("datos");
  $("#velo").classList.add("abierto"); $("#hoja").classList.add("abierto"); $("#hoja").setAttribute("aria-hidden", "false");
  setTimeout(() => $("#c-nombre")?.focus(), 300);
}
async function cerrar(forzar) {
  if (!forzar && ed?.sucio && !await preguntar("¿Descartar los cambios?", "Lo que escribiste no se ha guardado.", "Descartar", true)) return;
  ed = null;
  $("#velo").classList.remove("abierto"); $("#hoja").classList.remove("abierto"); $("#hoja").setAttribute("aria-hidden", "true");
}
$("#velo").onclick = () => cerrar(); $("#h-cerrar").onclick = () => cerrar(); $("#h-cancelar").onclick = () => cerrar();
document.addEventListener("keydown", e => { if (e.key === "Escape" && ed && !$("#dlg").open) cerrar(); });
$("#b-nuevo").onclick = () => abrir(null, {});
document.querySelectorAll(".pestanas button").forEach(b => b.onclick = () => mostrarTab(b.dataset.tab));

function mostrarTab(t) {
  ed.tab = t;
  document.querySelectorAll(".pestanas button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  const c = $("#h-cuerpo");
  c.innerHTML = { datos: htmlDatos, intereses: htmlIntereses, empleos: htmlEmpleos, vista: htmlVista }[t]();
  pintarIconos(c);
  ({ datos: enlazarDatos, intereses: enlazarIntereses, empleos: enlazarEmpleos, vista: enlazarVista })[t]();
}

function cajaChips(id, valores, vacio, extra = () => "") {
  return `<div class="caja" id="${id}">${valores.map((v, i) => `<span class="chip">${esc(v)}${extra(v, i)}<button data-q="${i}" aria-label="Quitar ${esc(v)}">${ic("x")}</button></span>`).join("")}<input type="text" placeholder="${esc(vacio)}" aria-label="${esc(vacio)}"></div>`;
}
/* Entrada de etiquetas: Enter o coma agrega; devuelve cuando cambia. */
function enlazarChips(id, lista, { validar, alCambiar, extra } = {}) {
  const caja = $("#" + id), campo = caja.querySelector("input");
  const agregar = () => {
    const v = campo.value.replace(/,/g, " ").trim().replace(/\s+/g, " ");
    if (!v) return;
    const err = validar?.(v);
    if (err) { aviso(err); return; }
    if (!lista.some(x => x.toLowerCase() === v.toLowerCase())) lista.push(v);
    ed.sucio = true; campo.value = ""; alCambiar();
  };
  campo.onkeydown = e => {
    if (e.key === "Enter" || e.key === ",") { e.preventDefault(); agregar(); }
    else if (e.key === "Backspace" && !campo.value && lista.length) { lista.pop(); ed.sucio = true; alCambiar(); }
  };
  campo.onblur = agregar;
  campo.onpaste = e => { const t = (e.clipboardData.getData("text") || ""); if (/[,;\n]/.test(t)) { e.preventDefault(); t.split(/[,;\n]+/).forEach(x => { campo.value = x; agregar(); }); } };
  caja.onclick = e => {
    const q = e.target.closest("[data-q]"), m = e.target.closest("[data-comillas]");
    if (q) { lista.splice(+q.dataset.q, 1); ed.sucio = true; alCambiar(); }
    else if (m) { const i = +m.dataset.comillas, v = lista[i]; lista[i] = /^".*"$/.test(v) ? v.slice(1, -1) : `"${v}"`; ed.sucio = true; alCambiar(); }
    else campo.focus();
  };
}
function recargarTab(foco) { mostrarTab(ed.tab); if (foco) $("#" + foco + " input")?.focus(); }

function htmlDatos() {
  const p = ed.p;
  return `<div id="err"></div>
  <div class="campo"><label for="c-nombre">Nombre del suscriptor</label><input type="text" id="c-nombre" value="${esc(p.nombre)}" maxlength="60" placeholder="Ej.: Grupo Indescar" autocomplete="off">
    <p class="ayuda">Así lo verás en esta lista. No se muestra en el correo.</p></div>
  <div class="campo"><label for="c-nota">Nota (opcional)</label><input type="text" id="c-nota" value="${esc(p.nota)}" maxlength="120" placeholder="Ej.: Cliente de cemento y fierro" autocomplete="off"></div>
  <div class="campo"><div class="rotulo">${ic("mail")}Correos que reciben el informe</div>${cajaChips("c-correos", p.correos, "Escribe un correo y pulsa Enter")}
    <p class="ayuda">Pueden ser varios; todos reciben el mismo informe.</p></div>
  <div class="campo"><div class="rotulo">Formato del informe</div>
    <div class="segmento"><button type="button" data-f="1" aria-pressed="${p.completo}">Completo</button><button type="button" data-f="0" aria-pressed="${!p.completo}">Resumido</button></div>
    <p class="ayuda">${p.completo ? "Cada día llega todo lo abierto, aunque ya se haya informado." : "Lo ya informado antes aparece abreviado; lo nuevo, completo."}</p></div>
  <div class="campo"><div class="interruptor"><div><b>Cotizaciones de la UNIQ</b><span class="ayuda">Recibe también las cotizaciones en línea de la Universidad Nacional Intercultural de Quillabamba.</span></div>
    <label class="sw"><input type="checkbox" id="c-uniq" ${p.uniq ? "checked" : ""} aria-label="Cotizaciones de la UNIQ"><i></i></label></div></div>`;
}
function enlazarDatos() {
  const p = ed.p;
  $("#c-nombre").oninput = e => { p.nombre = e.target.value; ed.sucio = true; };
  $("#c-nota").oninput = e => { p.nota = e.target.value; ed.sucio = true; };
  $("#c-uniq").onchange = e => { p.uniq = e.target.checked; ed.sucio = true; };
  document.querySelectorAll(".segmento button").forEach(b => b.onclick = () => { p.completo = b.dataset.f === "1"; ed.sucio = true; recargarTab(); });
  enlazarChips("c-correos", p.correos, {
    validar: v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? "" : "Ese correo no parece válido",
    alCambiar: () => recargarTab("c-correos"),
  });
}

let regionesCatalogo = null;
function htmlRegiones(clave, vacio, ayuda) {
  const lista = ed.p[clave];
  return `<div class="caja" id="c-${clave}">${lista.map((v, i) => `<span class="chip">${esc(v.replace("/", " › "))}<button data-q="${i}" aria-label="Quitar ${esc(v)}">${ic("x")}</button></span>`).join("") || `<span class="ayuda" style="padding:6px">${esc(vacio)}</span>`}</div>
    <div class="dupla" style="margin-top:8px"><select id="s-region-${clave}" aria-label="Región"><option value="">Región…</option></select>
      <select id="s-prov-${clave}" aria-label="Provincia" disabled><option value="">Toda la región</option></select>
      <button class="btn" id="b-region-${clave}" type="button">${ic("plus")}Agregar</button></div>
    <p class="ayuda">${esc(ayuda)}</p>`;
}
async function enlazarRegiones(clave) {
  const lista = ed.p[clave];
  $("#c-" + clave).onclick = e => { const q = e.target.closest("[data-q]"); if (q) { lista.splice(+q.dataset.q, 1); ed.sucio = true; recargarTab(); } };
  const sr = $("#s-region-" + clave), sp = $("#s-prov-" + clave);
  try {
    regionesCatalogo = regionesCatalogo || (await api("regiones")).regiones;
    regionesCatalogo.forEach(r => sr.insertAdjacentHTML("beforeend", `<option>${esc(r)}</option>`));
  } catch (e) { aviso("No se pudo leer la lista de regiones: " + e.message); }
  sr.onchange = async () => {
    sp.innerHTML = '<option value="">Toda la región</option>'; sp.disabled = !sr.value;
    if (!sr.value) return;
    try { (await api("provincias?region=" + encodeURIComponent(sr.value))).provincias.forEach(x => sp.insertAdjacentHTML("beforeend", `<option>${esc(x)}</option>`)); } catch (e) { aviso(e.message); }
  };
  $("#b-region-" + clave).onclick = () => {
    if (!sr.value) return aviso("Elige una región");
    const v = sr.value + (sp.value ? "/" + sp.value : "");
    if (!lista.includes(v)) lista.push(v);
    ed.sucio = true; recargarTab();
  };
}
const comillas = (v, i) => /\s/.test(v.replace(/"/g, "")) ? `<button data-comillas="${i}" class="${/^".*"$/.test(v) ? "activo" : ""}" title="Frase exacta: las palabras deben ir juntas" aria-label="Frase exacta">${ic("quote")}</button>` : "";

function htmlEmpleos() {
  const p = ed.p;
  return `<div id="err"></div>
  <div class="alerta info">${ic("briefcase")}<div>Ofertas de <b>Empleos Perú</b> (sector privado y público) y <b>Talento Perú</b> (SERVIR, sector público). Se activan al llenar algún campo de esta pestaña; vacía todo para no recibirlas.</div></div>
  <div class="campo"><div class="rotulo">${ic("tag")}Palabras del puesto</div>
    ${cajaChips("c-empleo_palabras", p.empleo_palabras, "Ej.: ingeniero, abogado, contador…", comillas)}
    <p class="ayuda">Se buscan en el título de la oferta. Sin palabras, recibe todas las ofertas de sus regiones.</p></div>
  <div class="campo"><div class="rotulo">${ic("pin")}Regiones de empleo</div>${htmlRegiones("empleo_regiones", "Vacío: usa las regiones de la pestaña Intereses (o todo el país si tampoco hay).",
      "Dónde quiere trabajar; puede ser distinto de donde sigue procesos de compra.")}</div>
  <div class="campo"><label for="c-sueldo">Sueldo mínimo mensual (S/)</label>
    <input type="number" id="c-sueldo" min="0" step="100" inputmode="numeric" value="${p.empleo_sueldo ?? ""}" placeholder="Ej.: 3000">
    <p class="ayuda">Quita lo que paga menos. Las ofertas que no publican sueldo se siguen mostrando, marcadas como “Sueldo no indicado”. Empleos Perú publica rangos (p. ej. 2,500–2,999): cuenta el tope del rango.</p></div>`;
}
function enlazarEmpleos() {
  const p = ed.p;
  enlazarChips("c-empleo_palabras", p.empleo_palabras, { alCambiar: () => recargarTab("c-empleo_palabras") });
  enlazarRegiones("empleo_regiones");
  $("#c-sueldo").oninput = e => { p.empleo_sueldo = e.target.value ? Math.max(0, parseInt(e.target.value, 10) || 0) || null : null; ed.sucio = true; };
}

function htmlIntereses() {
  const p = ed.p;
  const generales = p.palabras.filter(w => { const s = sinTildes(w.replace(/"/g, "")); return s.length < 4 || PALABRAS_GENERALES.has(s); });
  return `<div id="err"></div>
  <div class="campo"><div class="rotulo">${ic("pin")}Regiones</div>${htmlRegiones("regiones", "Sin regiones: las palabras clave se buscan en todo el país.",
      "Una región trae todo lo de ese departamento (gobierno regional, municipalidades, redes de salud…). Con provincia, solo esa provincia. Las palabras clave se buscan solo en estas regiones.")}</div>
  <div class="campo"><div class="rotulo">${ic("tag")}Palabras clave</div>
    ${cajaChips("c-palabras", p.palabras, "Escribe una palabra o frase y pulsa Enter", comillas)}
    <p class="ayuda">Varias palabras sin comillas: deben estar todas en el proceso. Con el botón de comillas: juntas y en ese orden.</p>
    ${generales.length ? `<div class="aviso-chip">${ic("warn")}<span>Muy general: <b>${esc(generales.join(", "))}</b>. Trae muchos resultados sin interés; prefiere algo más específico.</span></div>` : ""}</div>
  <div class="campo"><div class="rotulo">${ic("building")}Entidades que sigue</div>
    <div class="rel">${cajaChips("c-entidades", p.entidades, "Busca una entidad: municipalidad, UGEL, red de salud…")}<div class="sugerencias" id="sug" hidden></div></div>
    <p class="ayuda" id="ay-ent">Recibe todo lo que tengan abierto, esté o no en sus regiones. Basta con parte del nombre.</p></div>`;
}
async function enlazarIntereses() {
  const p = ed.p;
  enlazarChips("c-palabras", p.palabras, { alCambiar: () => recargarTab("c-palabras") });
  enlazarChips("c-entidades", p.entidades, { alCambiar: () => recargarTab("c-entidades") });
  enlazarRegiones("regiones");
  // autocompletado de entidades
  const campo = $("#c-entidades input"), sug = $("#sug");
  let marca = -1, opciones = [];
  const mostrar = () => {
    const q = sinTildes(campo.value.trim());
    if (!q || !entidadesCatalogo) { sug.hidden = true; return; }
    opciones = entidadesCatalogo.filter(([n]) => sinTildes(n).includes(q) && !p.entidades.some(x => sinTildes(n).includes(sinTildes(x)))).sort((a, b) => b[1] - a[1]).slice(0, 8);
    marca = -1;
    sug.hidden = !opciones.length;
    sug.innerHTML = opciones.map(([n, c], i) => `<button type="button" data-n="${i}"><span>${esc(n)}</span><small>${c} ${c === 1 ? "abierto" : "abiertos"}</small></button>`).join("");
  };
  campo.addEventListener("input", mostrar);
  campo.addEventListener("keydown", e => {
    if (sug.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); marca = (marca + (e.key === "ArrowDown" ? 1 : -1) + opciones.length) % opciones.length;
      sug.querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === marca));
    } else if (e.key === "Enter" && marca >= 0) { e.preventDefault(); e.stopImmediatePropagation(); elegir(opciones[marca][0]); }
  }, true);
  sug.onmousedown = e => { const b = e.target.closest("[data-n]"); if (b) { e.preventDefault(); elegir(opciones[+b.dataset.n][0]); } };
  const elegir = n => { p.entidades.push(n); ed.sucio = true; recargarTab("c-entidades"); };
  if (!entidadesCatalogo) cargarCatalogo();
}
async function cargarCatalogo() {
  try {
    const d = await api("entidades");
    if (!d.listo) { setTimeout(cargarCatalogo, 3000); $("#ay-ent") && ($("#ay-ent").textContent = "Cargando la lista de entidades del SEACE…"); return; }
    entidadesCatalogo = d.entidades;
    if (d.error) aviso("Lista de entidades no disponible (" + d.error + "): escribe el nombre a mano");
    else if ($("#ay-ent")) $("#ay-ent").textContent = `Recibe todo lo que tengan abierto, esté o no en sus regiones. Basta con parte del nombre. (${d.entidades.length} entidades con procesos hoy)`;
  } catch (e) { /* sin catálogo se escribe a mano */ }
}

function htmlVista() {
  return `<div id="err"></div><p class="ayuda" style="margin-top:0">Así recibiría el correo hoy, con datos reales. No se envía nada ni se guarda. Puede tardar un minuto.</p>
  <button class="btn primario" id="b-vista" type="button">${ic("eye")}Generar vista previa</button>
  <div id="previa" style="margin-top:16px"></div>`;
}
function enlazarVista() {
  if (ed.previa) mostrarPrevia();
  $("#b-vista").onclick = async e => {
    const b = e.currentTarget; b.disabled = true; b.innerHTML = ic("loader", "giro") + "Generando…";
    try { ed.previa = await api("vista", { perfil: ed.p }); mostrarPrevia(); }
    catch (err) { $("#err").innerHTML = `<div class="alerta">${ic("warn")}<div>${esc(err.message)}</div></div>`; }
    b.disabled = false; b.innerHTML = ic("eye") + "Generar de nuevo";
  };
}
function mostrarPrevia() {
  $("#previa").innerHTML = `<div class="previa"><div class="previa-asunto">${esc(ed.previa.asunto)}</div><iframe sandbox="allow-popups allow-popups-to-escape-sandbox" title="Vista previa del correo"></iframe></div>`;
  $("#previa iframe").srcdoc = ed.previa.html;
}

$("#h-guardar").onclick = async e => {
  const b = e.currentTarget, p = ed.p;
  p.nombre = p.nombre.trim();
  const falta = !p.nombre ? "Escribe un nombre" : !p.correos.length ? "Agrega al menos un correo" :
    !(p.uniq || p.palabras.length || p.entidades.length || p.regiones.length || p.empleo_palabras.length || p.empleo_regiones.length || p.empleo_sueldo) ? "Elige algo que seguir: regiones, palabras clave, entidades, empleos o la UNIQ" : "";
  if (falta) { mostrarTab(falta.startsWith("Elige") ? "intereses" : "datos"); $("#err").innerHTML = `<div class="alerta">${ic("warn")}<div>${esc(falta)}</div></div>`; return; }
  b.disabled = true;
  try {
    const d = await api("guardar", { original: ed.original, perfil: p });
    const nuevo = !ed.original;
    ed.sucio = false; await cerrar(true); await cargar();
    conDeshacer(nuevo ? `${p.nombre} agregado` : `${p.nombre} guardado`, d);
  } catch (err) { $("#err").innerHTML = `<div class="alerta">${ic("warn")}<div>${esc(err.message)}</div></div>`; $("#h-cuerpo").scrollTop = 0; }
  b.disabled = false;
};

/* ---------- historial ---------- */
$("#b-historial").onclick = async () => {
  const d = $("#dlg");
  d.innerHTML = '<div class="dlg ancho"><h3>Historial</h3><p>Cargando…</p></div>'; d.showModal();
  try {
    const [r, l] = await Promise.all([api("respaldos"), api("log")]);
    d.innerHTML = `<div class="dlg ancho"><h3>Historial de cambios</h3>
      <p>Antes de cada cambio se guarda una copia. Restaurar vuelve a esa versión (y también deja copia de la actual).</p>
      ${r.respaldos.slice(0, 15).map(x => `<div class="respaldo"><div><b>${esc(x.fecha)}</b><small>${esc(x.perfiles.join(" · ") || "vacío")}</small></div><button class="btn" data-r="${esc(x.archivo)}">${ic("undo")}Restaurar</button></div>`).join("") || '<p>Aún no hay cambios guardados.</p>'}
      <h3 style="margin-top:20px">Actividad reciente del bot</h3><div class="registro">${esc(l.lineas.join("\n") || "Sin registros todavía")}</div>
      <div class="botones" style="margin-top:16px"><button class="btn" data-cerrar>Cerrar</button></div></div>`;
    d.onclick = async e => {
      if (e.target.closest("[data-cerrar]")) return d.close();
      const b = e.target.closest("[data-r]");
      if (!b) return;
      try { await api("restaurar", { archivo: b.dataset.r }); d.close(); aviso("Versión restaurada"); cargar(); } catch (err) { aviso(err.message); }
    };
  } catch (e) { d.close(); aviso(e.message); }
};

/* ---------- inicio ---------- */
if (!CLAVE) { $("#sin-clave").hidden = false; }
else { $("#app").hidden = false; pintarIconos(); cargar(); cargarCatalogo(); }
</script>
</body>
</html>
